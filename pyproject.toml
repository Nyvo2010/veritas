[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "1.0.0"
description = "Veritas Deep Research Agent - deep, iterative web research with a live terminal UI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nyvo2010" }]
keywords = ["research", "tui", "llm", "openai-compatible", "tavily"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "nest-asyncio>=1.5.0",
    "rich>=13.0.0",
]

# Full keyboard-driven TUI. Prebuilt opentui wheels exist for CPython
# 3.12/3.13 (macOS, Linux, Windows); without it `veritas` runs the
# classic Rich CLI with the same features.
[project.optional-dependencies]
tui = [
    "opentui>=0.1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "main", "config", "settings", "tui_app", "runner_ui"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
veritas = "cli:main"

[project.urls]
Homepage = "https://github.com/Nyvo2010/veritas"
Issues = "https://github.com/Nyvo2010/veritas/issues"
