[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-research"
version = "1.0.1"
description = "Veritas Deep Research Agent - deep, iterative web research with a live terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nyvo2010" }]
keywords = ["research", "tui", "llm", "openai-compatible", "tavily"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    # The TUI engine. Its wheels only exist for CPython 3.12/3.13, so it is
    # requested there and skipped elsewhere (the app then runs its Rich CLI,
    # which is the same program). One install command either way.
    "opentui>=0.1.2; python_version >= '3.12' and python_version < '3.14'",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "main", "config", "settings", "tui_app", "runner_ui"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
veritas = "cli:main"

[project.urls]
Homepage = "https://github.com/Nyvo2010/veritas"
Issues = "https://github.com/Nyvo2010/veritas/issues"
